[defaults]
interpreter_python = /usr/bin/python3
inject_facts_as_vars = False
collections_paths = ./collections
# Auto-decrypt group_vars/host_vars *.sops.yaml via the community.sops vars
# plugin. host_group_vars must be listed too (setting this disables the implicit
# default). host_group_vars ignores *.sops.yaml, so there is no collision.
vars_plugins_enabled = host_group_vars,community.sops.sops
