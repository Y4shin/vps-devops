# DNS records for the zone apex.
#
# Template variables are resolved from group_vars/all.sops.yaml (sops_secrets) at sync time.
# All values support Jinja2 syntax: {{ domain }}, {{ vps_ipv4 }}, {{ vps_ipv6 }}, etc.
#
# Run:  task dns:plan   (dry run)
#       task dns:sync   (apply)

records:
  - name: "@"
    type: A
    value: "{{ vps_ipv4 }}"
    ttl: 3600

  - name: "@"
    type: AAAA
    value: "{{ vps_ipv6 }}"
    ttl: 3600
