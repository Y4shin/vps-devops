---
- name: Deploy Conference Tool
  hosts: vps

  vars:
    repo_root: "{{ playbook_dir }}/.."
    borg_rsh: "ssh -i /home/deploy/.ssh/borg_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
    deploy_user: "deploy"
    deploy_group: "deploy"
    conference_tool_image: "ghcr.io/y4shin/open-caucus:latest"
    conference_tool_container: "conference-tool-app-1"
    conference_tool_db_volume: "conference-tool_db_data"
    conference_tool_archive_prefix: "conference-tool"
    conference_tool_oidc_client_id: "conference-tool"
    conference_tool_application_slug: "conference-tool"
    conference_tool_access_group: "conference-user"
    conference_tool_admin_group: "conference-admin"

  tasks:
    - name: Check whether conference-tool secrets file exists
      ansible.builtin.stat:
        path: "{{ repo_root }}/conference-tool/.env.sops.yaml"
      delegate_to: localhost
      become: false
      register: conference_tool_secrets_file

    - name: Require conference-tool secrets file
      ansible.builtin.fail:
        msg: >-
          Create {{ repo_root }}/conference-tool/.env.sops.yaml with
          SESSION_SECRET, OAUTH_CLIENT_SECRET, borg_path, and
          borg_passphrase before deploying.
      when: not conference_tool_secrets_file.stat.exists

    - name: Set secrets variables
      ansible.builtin.set_fact:
        secrets: "{{ lookup('community.sops.sops', repo_root + '/secrets.sops.yaml') | from_yaml }}"
        conference_tool_secrets: "{{ lookup('community.sops.sops', repo_root + '/conference-tool/.env.sops.yaml') | from_yaml }}"
      no_log: true

    - name: Check whether n8n secrets file exists (for webhook secret)
      ansible.builtin.stat:
        path: "{{ repo_root }}/n8n/.env.sops.yaml"
      delegate_to: localhost
      become: false
      register: ct_n8n_secrets_file

    - name: Load n8n secrets for webhook integration
      ansible.builtin.set_fact:
        ct_n8n_secrets: "{{ lookup('community.sops.sops', repo_root + '/n8n/.env.sops.yaml') | from_yaml }}"
      when: ct_n8n_secrets_file.stat.exists
      no_log: true

    - name: Set webhook secret fact
      ansible.builtin.set_fact:
        ct_webhook_secret: "{{ ct_n8n_secrets.WEBHOOK_SECRET | default('') }}"
      no_log: true

    - name: Validate conference-tool secrets
      ansible.builtin.assert:
        that:
          - conference_tool_secrets.SESSION_SECRET is defined
          - (conference_tool_secrets.SESSION_SECRET | trim) != ""
          - conference_tool_secrets.OAUTH_CLIENT_SECRET is defined
          - (conference_tool_secrets.OAUTH_CLIENT_SECRET | trim) != ""
          - conference_tool_secrets.borg_path is defined
          - (conference_tool_secrets.borg_path | trim) != ""
          - conference_tool_secrets.borg_passphrase is defined
          - (conference_tool_secrets.borg_passphrase | trim) != ""
        fail_msg: >-
          conference-tool/.env.sops.yaml must define SESSION_SECRET,
          OAUTH_CLIENT_SECRET, borg_path, and borg_passphrase.
      no_log: true

    # -------------------------------------------------------------------------
    # Borg — SSH key, env file, and repo initialization
    # -------------------------------------------------------------------------
    - name: Set Borg repo URL
      ansible.builtin.set_fact:
        ct_borg_repo: "ssh://{{ secrets.borg_user }}@{{ secrets.borg_host }}:23/{{ conference_tool_secrets.borg_path }}"
      no_log: true

    - name: Decrypt Borg SSH key to local temp file
      ansible.builtin.shell:
        cmd: sops -d --extract '["data"]' {{ repo_root }}/borg/ssh_key.sops > /tmp/borg_key_deploy
      environment:
        SOPS_AGE_KEY_FILE: "{{ repo_root }}/age.key"
      delegate_to: localhost
      become: false
      no_log: true
      changed_when: false

    - name: Deploy Borg SSH key
      ansible.builtin.copy:
        src: /tmp/borg_key_deploy
        dest: /home/deploy/.ssh/borg_key
        mode: "0600"
      no_log: true

    - name: Remove local temp Borg SSH key
      ansible.builtin.file:
        path: /tmp/borg_key_deploy
        state: absent
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Write conference-tool Borg environment file
      ansible.builtin.copy:
        dest: /opt/vps-devops/scripts/conference-tool-borg-env
        content: |
          export BORG_REPO="{{ ct_borg_repo }}"
          export BORG_PASSPHRASE="{{ conference_tool_secrets.borg_passphrase }}"
          export BORG_RSH="{{ borg_rsh }}"
        mode: "0600"
      no_log: true

    - name: Check if conference-tool Borg repo is already initialized
      ansible.builtin.command:
        cmd: borg info {{ ct_borg_repo }}
      environment:
        BORG_PASSPHRASE: "{{ conference_tool_secrets.borg_passphrase }}"
        BORG_RSH: "{{ borg_rsh }}"
      register: ct_borg_info
      failed_when: false
      changed_when: false
      no_log: true

    - name: Initialize conference-tool Borg repository
      ansible.builtin.command:
        cmd: borg init --encryption=repokey {{ ct_borg_repo }}
      environment:
        BORG_PASSPHRASE: "{{ conference_tool_secrets.borg_passphrase }}"
        BORG_RSH: "{{ borg_rsh }}"
      when: ct_borg_info.rc != 0
      no_log: true

    # -------------------------------------------------------------------------
    # Backup infrastructure
    # -------------------------------------------------------------------------
    - name: Create shared backups directory
      ansible.builtin.file:
        path: /opt/vps-devops/backups
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_group }}"
        mode: "0770"
      become: true

    - name: Ensure shared backup lock file is writable by deploy
      ansible.builtin.file:
        path: /opt/vps-devops/backups/.backup-job.lock
        state: touch
        owner: "{{ deploy_user }}"
        group: "{{ deploy_group }}"
        mode: "0660"
      become: true

    - name: Create conference-tool backup staging directory
      ansible.builtin.file:
        path: /opt/vps-devops/backups/conference-tool-staging
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_group }}"
        mode: "0700"
      become: true

    - name: Write conference-tool backup environment file
      ansible.builtin.copy:
        dest: /opt/vps-devops/scripts/conference-tool-backup-env
        content: |
          export CT_CONTAINER={{ conference_tool_container }}
          export CT_DB_VOLUME={{ conference_tool_db_volume }}
          export CT_STAGING_DIR=/opt/vps-devops/backups/conference-tool-staging
          export CT_ARCHIVE_PREFIX={{ conference_tool_archive_prefix }}
        mode: "0600"

    - name: Copy conference-tool backup script
      ansible.builtin.copy:
        src: "{{ repo_root }}/scripts/backup-conference-tool.sh"
        dest: /opt/vps-devops/scripts/backup-conference-tool.sh
        mode: "0750"

    - name: Copy conference-tool restore script
      ansible.builtin.copy:
        src: "{{ repo_root }}/scripts/restore-conference-tool.sh"
        dest: /opt/vps-devops/scripts/restore-conference-tool.sh
        mode: "0750"

    - name: Install conference-tool backup systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/conference-tool-backup.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Run conference-tool Borg backup
          Wants=network-online.target
          After=network-online.target docker.service

          [Service]
          Type=oneshot
          WorkingDirectory=/opt/vps-devops/scripts
          ExecStart=/bin/bash /opt/vps-devops/scripts/backup-conference-tool.sh

          [Install]
          WantedBy=multi-user.target
      become: true
      register: ct_backup_service_unit

    - name: Install conference-tool backup systemd timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/conference-tool-backup.timer
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Schedule daily conference-tool Borg backup

          [Timer]
          OnCalendar=*-*-* 05:30:00
          Persistent=true
          Unit=conference-tool-backup.service

          [Install]
          WantedBy=timers.target
      become: true
      register: ct_backup_timer_unit

    - name: Reload systemd after conference-tool backup unit changes
      ansible.builtin.systemd_service:
        daemon_reload: true
      become: true
      when: ct_backup_service_unit.changed or ct_backup_timer_unit.changed

    - name: Enable and start conference-tool backup timer
      ansible.builtin.systemd_service:
        name: conference-tool-backup.timer
        enabled: true
        state: "{{ 'restarted' if ct_backup_service_unit.changed or ct_backup_timer_unit.changed else 'started' }}"
      become: true

    # -------------------------------------------------------------------------
    # Conference Tool — deploy with digest-based update detection
    # -------------------------------------------------------------------------
    - name: Create conference-tool directory
      ansible.builtin.file:
        path: /opt/vps-devops/conference-tool
        state: directory
        mode: "0755"

    - name: Render conference-tool compose file
      ansible.builtin.template:
        src: "{{ repo_root }}/conference-tool/docker-compose.yml.j2"
        dest: /opt/vps-devops/conference-tool/docker-compose.yml
        mode: "0644"
      register: ct_compose_result

    - name: Pull latest conference-tool image
      ansible.builtin.command:
        cmd: "docker pull {{ conference_tool_image }} --quiet"
      changed_when: false

    - name: Get current conference-tool image digest
      ansible.builtin.command:
        cmd: "docker inspect {{ conference_tool_image }} --format '{% raw %}{{.Id}}{% endraw %}'"
      register: ct_current_digest
      changed_when: false

    - name: Read last deployed digest
      ansible.builtin.slurp:
        src: /opt/vps-devops/conference-tool/.last-deployed-digest
      register: ct_last_digest_file
      failed_when: false

    - name: Set last deployed digest fact
      ansible.builtin.set_fact:
        ct_last_digest: "{{ ct_last_digest_file.content | default('') | b64decode | trim }}"

    - name: Set image change fact
      ansible.builtin.set_fact:
        ct_image_changed: "{{ ct_last_digest != ct_current_digest.stdout }}"

    - name: Backup conference-tool before deploy
      ansible.builtin.command:
        cmd: bash /opt/vps-devops/scripts/backup-conference-tool.sh
      when: ct_image_changed and ct_last_digest != ""

    - name: Build conference-tool env content
      ansible.builtin.set_fact:
        ct_env_content: |
          ENVIRONMENT=production
          HOST=0.0.0.0
          PORT=8080
          LOG_FORMAT=json
          LOG_LEVEL=info
          SERVICE_NAME=conference-tool
          SESSION_SECRET={{ conference_tool_secrets.SESSION_SECRET }}
          SESSION_EXPIRATION=86400
          DATABASE_PATH=/data/conference.db
          STORAGE_DIR=/data/uploads
          AUTH_PASSWORD_ENABLED=false
          AUTH_OAUTH_ENABLED=true
          OAUTH_ISSUER_URL=https://authentik.{{ secrets.domain }}/application/o/{{ conference_tool_application_slug }}/
          OAUTH_CLIENT_ID={{ conference_tool_oidc_client_id }}
          OAUTH_CLIENT_SECRET={{ conference_tool_secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_REDIRECT_URL=https://conference.{{ secrets.domain }}/oauth/callback
          OAUTH_SCOPES=openid,profile,email
          OAUTH_GROUPS_CLAIM=groups
          OAUTH_USERNAME_CLAIMS=preferred_username,email,sub
          OAUTH_FULL_NAME_CLAIMS=name,preferred_username,email
          OAUTH_PROVISIONING_MODE=auto_create
          OAUTH_REQUIRED_GROUPS={{ conference_tool_access_group }}
          OAUTH_ADMIN_GROUP={{ conference_tool_admin_group }}
          WEBHOOK_URLS=https://n8n.{{ secrets.domain }}/webhook/meeting-events
          WEBHOOK_SECRET={{ ct_webhook_secret | default('') }}
      no_log: true

    - name: Build conference-tool env hash
      ansible.builtin.set_fact:
        ct_env_hash: "{{ ct_env_content | hash('sha256') }}"
      no_log: true

    - name: Read previous conference-tool env hash
      ansible.builtin.slurp:
        src: /opt/vps-devops/conference-tool/.env.sha256
      register: ct_env_hash_file
      failed_when: false
      no_log: true

    - name: Decide whether conference-tool env changed
      ansible.builtin.set_fact:
        ct_env_changed: "{{ (ct_env_hash_file.content | default('') | b64decode | trim) != ct_env_hash }}"
      no_log: true

    - name: Deploy conference-tool with temporary .env
      block:
        - name: Write conference-tool .env
          ansible.builtin.copy:
            dest: /opt/vps-devops/conference-tool/.env
            content: "{{ ct_env_content }}"
            mode: "0600"
          no_log: true

        - name: Store conference-tool env hash
          ansible.builtin.copy:
            dest: /opt/vps-devops/conference-tool/.env.sha256
            content: "{{ ct_env_hash }}\n"
            mode: "0600"
          no_log: true

        - name: Decide whether conference-tool needs full recreate
          ansible.builtin.set_fact:
            ct_needs_recreate: >-
              {{
                ct_image_changed
                or ct_compose_result.changed
                or ct_env_changed
              }}

        - name: Recreate conference-tool when image changed
          community.docker.docker_compose_v2:
            project_src: /opt/vps-devops/conference-tool
            pull: never
            state: present
            recreate: always
          when: ct_image_changed

        - name: Recreate conference-tool when config changed
          community.docker.docker_compose_v2:
            project_src: /opt/vps-devops/conference-tool
            state: present
            recreate: always
          when: not ct_image_changed and ct_needs_recreate

        - name: Ensure conference-tool is running without forced recreate
          community.docker.docker_compose_v2:
            project_src: /opt/vps-devops/conference-tool
            state: present
          when: not ct_needs_recreate

        - name: Record deployed digest
          ansible.builtin.copy:
            dest: /opt/vps-devops/conference-tool/.last-deployed-digest
            content: "{{ ct_current_digest.stdout }}"
            mode: "0644"
          when: ct_image_changed
      always:
        - name: Remove conference-tool temporary .env
          ansible.builtin.file:
            path: /opt/vps-devops/conference-tool/.env
            state: absent
