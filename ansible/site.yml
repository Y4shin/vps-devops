---
# Deploys all services. Run with: task deploy
#
# Each play is tagged with its service name, so a single service can be
# deployed in isolation, e.g.:
#     task deploy:traefik          # -> site.yml --tags traefik
#     ansible-playbook ansible/site.yml --tags authentik
- name: Base host configuration
  hosts: vps
  gather_facts: true
  become: true
  tags: base
  roles:
    - base

- name: Traefik reverse proxy
  hosts: vps
  tags: traefik
  roles:
    - traefik

- name: Mail relay
  hosts: vps
  tags: mail
  roles:
    - mail

- name: Authentik IdP
  hosts: vps
  tags: authentik
  roles:
    - authentik

# Runs after Authentik so the headscale OIDC application/provider/group exist.
- name: Headscale control server
  hosts: vps
  tags: headscale
  roles:
    - headscale

- name: Workflow automation (n8n)
  hosts: vps
  tags: n8n
  roles:
    - n8n

- name: Witness
  hosts: vps
  tags: witness
  roles:
    - witness

- name: Conference Tool
  hosts: vps
  tags: conference_tool
  roles:
    - conference_tool

- name: Foundry VTT
  hosts: vps
  tags: foundry
  roles:
    - foundry
