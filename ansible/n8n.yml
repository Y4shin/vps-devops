---
- name: Deploy n8n
  hosts: vps

  vars:
    repo_root: "{{ playbook_dir }}/.."
    deploy_user: "deploy"
    deploy_group: "deploy"
    n8n_workflow_name: "Conference Tool — Authentik Group Sync"

  tasks:
    - name: Check whether n8n secrets file exists
      ansible.builtin.stat:
        path: "{{ repo_root }}/n8n/.env.sops.yaml"
      delegate_to: localhost
      become: false
      register: n8n_secrets_file

    - name: Require n8n secrets file
      ansible.builtin.fail:
        msg: >-
          Create {{ repo_root }}/n8n/.env.sops.yaml with
          N8N_ENCRYPTION_KEY, N8N_OWNER_EMAIL, N8N_OWNER_PASSWORD,
          and WEBHOOK_SECRET before deploying n8n.
      when: not n8n_secrets_file.stat.exists

    - name: Set secrets variables
      ansible.builtin.set_fact:
        secrets: "{{ lookup('community.sops.sops', repo_root + '/secrets.sops.yaml') | from_yaml }}"
        n8n_secrets: "{{ lookup('community.sops.sops', repo_root + '/n8n/.env.sops.yaml') | from_yaml }}"
      no_log: true

    - name: Validate n8n secrets
      ansible.builtin.assert:
        that:
          - n8n_secrets.N8N_ENCRYPTION_KEY is defined
          - (n8n_secrets.N8N_ENCRYPTION_KEY | trim) != ""
          - n8n_secrets.N8N_OWNER_EMAIL is defined
          - (n8n_secrets.N8N_OWNER_EMAIL | trim) != ""
          - n8n_secrets.N8N_OWNER_PASSWORD is defined
          - (n8n_secrets.N8N_OWNER_PASSWORD | trim) != ""
          - n8n_secrets.WEBHOOK_SECRET is defined
          - (n8n_secrets.WEBHOOK_SECRET | trim) != ""
        fail_msg: >-
          n8n/.env.sops.yaml must define N8N_ENCRYPTION_KEY, N8N_OWNER_EMAIL,
          N8N_OWNER_PASSWORD, and WEBHOOK_SECRET.
      no_log: true

    - name: Check for Authentik-provisioned n8n API token
      ansible.builtin.stat:
        path: /opt/vps-devops/authentik/n8n-api-token
      register: n8n_api_token_file_stat

    - name: Require Authentik-provisioned n8n API token
      ansible.builtin.fail:
        msg: >-
          /opt/vps-devops/authentik/n8n-api-token not found.
          Run task deploy:authentik first to provision the n8n service account and API token.
      when: not n8n_api_token_file_stat.stat.exists

    - name: Read Authentik-provisioned n8n API token
      ansible.builtin.slurp:
        src: /opt/vps-devops/authentik/n8n-api-token
      register: n8n_api_token_raw
      no_log: true

    - name: Set n8n Authentik API token fact
      ansible.builtin.set_fact:
        n8n_authentik_api_token: "{{ n8n_api_token_raw.content | b64decode | trim }}"
      no_log: true

    - name: Create n8n directory
      ansible.builtin.file:
        path: /opt/vps-devops/n8n
        state: directory
        mode: "0755"

    - name: Ensure proxy network exists
      community.docker.docker_network:
        name: proxy
        ipam_config:
          - subnet: "{{ secrets.proxy_subnet }}"

    - name: Render n8n compose file
      ansible.builtin.template:
        src: "{{ repo_root }}/n8n/docker-compose.yml.j2"
        dest: /opt/vps-devops/n8n/docker-compose.yml
        mode: "0644"

    - name: Build n8n env content
      ansible.builtin.set_fact:
        n8n_env_content: |
          N8N_HOST=n8n.{{ secrets.domain }}
          N8N_PORT=5678
          N8N_PROTOCOL=https
          WEBHOOK_URL=https://n8n.{{ secrets.domain }}/
          N8N_ENCRYPTION_KEY={{ n8n_secrets.N8N_ENCRYPTION_KEY }}
      no_log: true

    - name: Deploy n8n with temporary .env
      block:
        - name: Write n8n .env
          ansible.builtin.copy:
            dest: /opt/vps-devops/n8n/.env
            content: "{{ n8n_env_content }}"
            mode: "0600"
          no_log: true

        - name: Deploy n8n container
          community.docker.docker_compose_v2:
            project_src: /opt/vps-devops/n8n
            state: present
            recreate: always

        - name: Wait for n8n to be healthy
          ansible.builtin.uri:
            url: http://127.0.0.1:5678/healthz
            method: GET
            status_code: 200
          register: n8n_health
          retries: 30
          delay: 5
          until: n8n_health.status == 200

      always:
        - name: Remove n8n temporary .env
          ansible.builtin.file:
            path: /opt/vps-devops/n8n/.env
            state: absent

    # -------------------------------------------------------------------------
    # Workflow deployment
    # -------------------------------------------------------------------------

    - name: Copy workflow JSON to server
      ansible.builtin.copy:
        src: "{{ repo_root }}/n8n/workflow.json"
        dest: /opt/vps-devops/n8n/workflow.json
        mode: "0644"

    - name: Patch workflow Config node values
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json

          with open('/opt/vps-devops/n8n/workflow.json') as f:
              wf = json.load(f)

          for node in wf['nodes']:
              if node['name'] == 'Config':
                  for a in node['parameters']['assignments']['assignments']:
                      if a['name'] == 'authentik_base_url':
                          a['value'] = 'https://authentik.{{ secrets.domain }}'
                      elif a['name'] == 'authentik_token':
                          a['value'] = '{{ n8n_authentik_api_token }}'
                      elif a['name'] == 'webhook_secret':
                          a['value'] = '{{ n8n_secrets.WEBHOOK_SECRET }}'

          with open('/opt/vps-devops/n8n/workflow-deploy.json', 'w') as f:
              json.dump(wf, f)
          PYEOF
      no_log: true

    - name: Deploy workflow via n8n API
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail

          N8N="http://127.0.0.1:5678"
          OWNER_EMAIL='{{ n8n_secrets.N8N_OWNER_EMAIL | to_json }}'
          OWNER_PASSWORD='{{ n8n_secrets.N8N_OWNER_PASSWORD | to_json }}'
          WORKFLOW_NAME='{{ n8n_workflow_name | to_json }}'
          COOKIE=$(mktemp)
          trap "rm -f $COOKIE /opt/vps-devops/n8n/workflow-deploy.json" EXIT

          wait_for_rest_api() {
            # /healthz passes before the REST layer is ready; /rest/settings
            # only returns 200 once the full API is initialised.
            for i in $(seq 1 30); do
              REST_STATUS=$(curl -s --max-time 5 "$N8N/rest/settings" \
                -o /dev/null -w "%{http_code}" 2>/dev/null || echo "000")
              [ "$REST_STATUS" = "200" ] && return 0
              sleep 3
            done
            echo "n8n REST API did not become ready in time" >&2
            return 1
          }

          wait_for_rest_api

          # Attempt login (owner already exists from prior run)
          HTTP="000"
          for i in 1 2 3; do
            HTTP=$(curl -s --max-time 15 -X POST "$N8N/rest/login" \
              -H 'Content-Type: application/json' \
              -d "{\"emailOrLdapLoginId\":$OWNER_EMAIL,\"password\":$OWNER_PASSWORD}" \
              -c "$COOKIE" -o /dev/null -w "%{http_code}")
            [ "$HTTP" = "200" ] && break
            [ "$HTTP" = "401" ] && break  # wrong credentials — stop retrying
            sleep 3
          done

          if [ "$HTTP" != "200" ]; then
            # Credentials don't match or no owner set up.
            # Stop the container before reset to avoid SQLite lock conflicts.
            docker stop n8n-n8n-1
            docker run --rm -v n8n_data:/home/node/.n8n \
              --entrypoint /usr/local/bin/n8n n8nio/n8n:latest user-management:reset
            docker start n8n-n8n-1
            wait_for_rest_api
            # Setup owner
            curl -s --max-time 15 -X POST "$N8N/rest/owner/setup" \
              -H 'Content-Type: application/json' \
              -d "{\"email\":$OWNER_EMAIL,\"firstName\":\"Admin\",\"lastName\":\"Admin\",\"password\":$OWNER_PASSWORD,\"mfaEnabled\":false}" \
              -o /dev/null
            HTTP=$(curl -s --max-time 15 -X POST "$N8N/rest/login" \
              -H 'Content-Type: application/json' \
              -d "{\"emailOrLdapLoginId\":$OWNER_EMAIL,\"password\":$OWNER_PASSWORD}" \
              -c "$COOKIE" -o /dev/null -w "%{http_code}")
          fi

          if [ "$HTTP" != "200" ]; then
            echo "n8n login failed (HTTP $HTTP)" >&2
            exit 1
          fi

          WORKFLOW_JSON=$(cat /opt/vps-devops/n8n/workflow-deploy.json)

          # Check if workflow already exists
          EXISTING=$(curl -sf --max-time 15 \
            -b "$COOKIE" "$N8N/rest/workflows" | \
            python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for wf in data.get('data', []):
              if wf['name'] == $WORKFLOW_NAME:
                  print(wf['id'])
                  break
          ")

          if [ -n "$EXISTING" ]; then
            # Fetch current versionId, then PATCH
            VERSION_ID=$(curl -sf --max-time 15 -b "$COOKIE" "$N8N/rest/workflows/$EXISTING" | \
              python3 -c "import sys, json; print(json.load(sys.stdin)['data']['versionId'])")
            PATCHED=$(echo "$WORKFLOW_JSON" | python3 -c "
          import sys, json
          wf = json.load(sys.stdin)
          wf['id'] = sys.argv[1]
          wf['versionId'] = sys.argv[2]
          print(json.dumps(wf))
          " "$EXISTING" "$VERSION_ID")
            PATCH_RESP=$(curl -sf --max-time 15 -X PATCH \
              -H 'Content-Type: application/json' \
              -b "$COOKIE" \
              "$N8N/rest/workflows/$EXISTING" \
              -d "$PATCHED")
            VERSION_ID=$(echo "$PATCH_RESP" | python3 -c "import sys, json; print(json.load(sys.stdin)['data']['versionId'])")
            WORKFLOW_ID="$EXISTING"
            echo "Updated workflow $WORKFLOW_ID"
          else
            CREATED=$(curl -sf --max-time 15 -X POST \
              -H 'Content-Type: application/json' \
              -b "$COOKIE" \
              "$N8N/rest/workflows" \
              -d "$WORKFLOW_JSON")
            WORKFLOW_ID=$(echo "$CREATED" | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['id'])")
            VERSION_ID=$(echo "$CREATED" | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['versionId'])")
            echo "Created workflow $WORKFLOW_ID"
          fi

          # Activate; on 409 (webhook conflict) deactivate the conflicting workflow and retry
          ACTIVATE_TMP=$(mktemp)
          for _act_retry in 1 2; do
            ACTIVATE_HTTP=$(curl -s --max-time 15 -X POST \
              -H 'Content-Type: application/json' \
              -b "$COOKIE" \
              "$N8N/rest/workflows/$WORKFLOW_ID/activate" \
              -d "{\"versionId\":\"$VERSION_ID\"}" \
              -o "$ACTIVATE_TMP" -w "%{http_code}")
            if [ "$ACTIVATE_HTTP" = "200" ]; then
              rm -f "$ACTIVATE_TMP"
              echo "Activated workflow $WORKFLOW_ID"
              break
            elif [ "$ACTIVATE_HTTP" = "409" ] && [ "$_act_retry" = "1" ]; then
              CONFLICTS=$(python3 -c "
          import sys, json
          try:
              resp = json.load(open('$ACTIVATE_TMP'))
              for c in json.loads(resp.get('hint', '[]')):
                  print(c['conflict']['workflowId'])
          except Exception:
              pass
          " 2>/dev/null || true)
              while IFS= read -r _wfid; do
                [ -n "$_wfid" ] || continue
                curl -sf -X POST "$N8N/rest/workflows/$_wfid/deactivate" \
                  -b "$COOKIE" -o /dev/null || true
                echo "Deactivated conflicting workflow $_wfid"
              done <<< "$CONFLICTS"
            else
              rm -f "$ACTIVATE_TMP"
              echo "Activate failed (HTTP $ACTIVATE_HTTP)" >&2
              exit 1
            fi
          done
      args:
        executable: /bin/bash
      register: n8n_workflow_result
      changed_when: "'Created workflow' in n8n_workflow_result.stdout"
      no_log: true

    - name: Show workflow deployment result
      ansible.builtin.debug:
        msg: "{{ n8n_workflow_result.stdout_lines }}"
