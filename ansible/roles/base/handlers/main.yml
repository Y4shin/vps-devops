---
- name: Reload sshd
  ansible.builtin.service:
    name: ssh
    state: reloaded

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted
- name: Ensure deploy group uses the managed GID
  ansible.builtin.group:
    name: "{{ deploy_group }}"
    gid: "{{ deploy_gid }}"
    system: true

- name: Ensure deploy user uses the managed UID/GID
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    uid: "{{ deploy_uid }}"
    group: "{{ deploy_group }}"
    system: true
    create_home: true
    shell: /bin/bash
