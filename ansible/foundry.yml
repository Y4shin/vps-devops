---
- name: Deploy Foundry VTT
  hosts: vps

  vars:
    repo_root: "{{ playbook_dir }}/.."
    borg_rsh: "ssh -i /home/deploy/.ssh/borg_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
    deploy_user: "deploy"
    deploy_group: "deploy"
    foundry_container_name: "foundry-foundry-1"
    foundry_archive_prefix: "foundry"
    foundry_image: "felddy/foundryvtt:14.359"
    foundry_default_public_hostname: "foundry.{{ secrets.domain }}"

  tasks:
    - name: Check whether Foundry secrets file exists
      ansible.builtin.stat:
        path: "{{ repo_root }}/foundry/.env.sops.yaml"
      delegate_to: localhost
      become: false
      register: foundry_secrets_file

    - name: Require Foundry secrets file
      ansible.builtin.fail:
        msg: >-
          Create {{ repo_root }}/foundry/.env.sops.yaml with
          FOUNDRY_ADMIN_KEY, borg_path, borg_passphrase, and either
          FOUNDRY_RELEASE_URL or FOUNDRY_USERNAME plus FOUNDRY_PASSWORD
          before deploying Foundry.
      when: not foundry_secrets_file.stat.exists

    - name: Set Foundry secrets variables
      ansible.builtin.set_fact:
        secrets: "{{ lookup('community.sops.sops', repo_root + '/secrets.sops.yaml') | from_yaml }}"
        foundry_secrets: "{{ lookup('community.sops.sops', repo_root + '/foundry/.env.sops.yaml') | from_yaml }}"
      no_log: true

    - name: Require Foundry secret values
      ansible.builtin.assert:
        that:
          - foundry_secrets.FOUNDRY_ADMIN_KEY is defined
          - (foundry_secrets.FOUNDRY_ADMIN_KEY | trim) != ""
          - foundry_secrets.borg_path is defined
          - (foundry_secrets.borg_path | trim) != ""
          - foundry_secrets.borg_passphrase is defined
          - (foundry_secrets.borg_passphrase | trim) != ""
          - >-
            (
              foundry_secrets.FOUNDRY_RELEASE_URL is defined
              and (foundry_secrets.FOUNDRY_RELEASE_URL | trim) != ""
            )
            or
            (
              foundry_secrets.FOUNDRY_USERNAME is defined
              and (foundry_secrets.FOUNDRY_USERNAME | trim) != ""
              and foundry_secrets.FOUNDRY_PASSWORD is defined
              and (foundry_secrets.FOUNDRY_PASSWORD | trim) != ""
            )
        fail_msg: >-
          foundry/.env.sops.yaml must define FOUNDRY_ADMIN_KEY, borg_path,
          borg_passphrase, and either FOUNDRY_RELEASE_URL or both
          FOUNDRY_USERNAME and FOUNDRY_PASSWORD.
      no_log: true

    - name: Set Foundry public hostname fact
      ansible.builtin.set_fact:
        foundry_public_hostname: "{{ foundry_secrets.FOUNDRY_PUBLIC_HOSTNAME | default(foundry_default_public_hostname, true) }}"
      no_log: true

    - name: Create Foundry directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner | default(deploy_user) }}"
        group: "{{ item.group | default(deploy_group) }}"
        mode: "{{ item.mode }}"
      become: true
      loop:
        - { path: /opt/vps-devops/foundry, mode: "0755" }
        - { path: /opt/vps-devops/foundry/data, mode: "0775", owner: "1000", group: "1000" }
        - { path: /opt/vps-devops/foundry/data/container_cache, mode: "0775", owner: "1000", group: "1000" }

    - name: Check Foundry container_cache directory owner
      ansible.builtin.stat:
        path: /opt/vps-devops/foundry/data/container_cache
      register: foundry_cache_stat

    - name: Fix Foundry data ownership for container user
      ansible.builtin.command: chown -R 1000:1000 /opt/vps-devops/foundry/data
      become: true
      when: foundry_cache_stat.stat.exists and foundry_cache_stat.stat.uid != 1000

    - name: Create shared backups directory
      ansible.builtin.file:
        path: /opt/vps-devops/backups
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_group }}"
        mode: "0770"
      become: true

    - name: Ensure shared backup lock file is writable by deploy
      ansible.builtin.file:
        path: /opt/vps-devops/backups/.backup-job.lock
        state: touch
        owner: "{{ deploy_user }}"
        group: "{{ deploy_group }}"
        mode: "0660"
      become: true

    - name: Set Foundry Borg repo URL
      ansible.builtin.set_fact:
        foundry_borg_repo: "ssh://{{ secrets.borg_user }}@{{ secrets.borg_host }}:23/{{ foundry_secrets.borg_path }}"
      no_log: true

    - name: Decrypt Borg SSH key to local temp file
      ansible.builtin.shell:
        cmd: sops -d --extract '["data"]' {{ repo_root }}/borg/ssh_key.sops > /tmp/borg_key_deploy
      environment:
        SOPS_AGE_KEY_FILE: "{{ repo_root }}/age.key"
      delegate_to: localhost
      become: false
      no_log: true
      changed_when: false

    - name: Deploy Borg SSH key
      ansible.builtin.copy:
        src: /tmp/borg_key_deploy
        dest: /home/deploy/.ssh/borg_key
        mode: "0600"
      no_log: true

    - name: Remove local temp Borg SSH key
      ansible.builtin.file:
        path: /tmp/borg_key_deploy
        state: absent
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Write Foundry Borg environment file
      ansible.builtin.copy:
        dest: /opt/vps-devops/scripts/foundry-borg-env
        content: |
          export BORG_REPO="{{ foundry_borg_repo }}"
          export BORG_PASSPHRASE="{{ foundry_secrets.borg_passphrase }}"
          export BORG_RSH="{{ borg_rsh }}"
        mode: "0600"
      no_log: true

    - name: Check if Foundry Borg repo is already initialized
      ansible.builtin.command:
        cmd: borg info {{ foundry_borg_repo }}
      environment:
        BORG_PASSPHRASE: "{{ foundry_secrets.borg_passphrase }}"
        BORG_RSH: "{{ borg_rsh }}"
      register: foundry_borg_info
      failed_when: false
      changed_when: false
      no_log: true

    - name: Initialize Foundry Borg repository
      ansible.builtin.command:
        cmd: borg init --encryption=repokey {{ foundry_borg_repo }}
      environment:
        BORG_PASSPHRASE: "{{ foundry_secrets.borg_passphrase }}"
        BORG_RSH: "{{ borg_rsh }}"
      when: foundry_borg_info.rc != 0
      no_log: true

    - name: Write Foundry backup environment file
      ansible.builtin.copy:
        dest: /opt/vps-devops/scripts/foundry-backup-env
        content: |
          export FOUNDRY_ROOT=/opt/vps-devops/foundry
          export FOUNDRY_DATA_DIR=/opt/vps-devops/foundry/data
          export FOUNDRY_CONTAINER={{ foundry_container_name }}
          export FOUNDRY_PUBLIC_HOSTNAME={{ foundry_public_hostname }}
          export FOUNDRY_ARCHIVE_PREFIX={{ foundry_archive_prefix }}
        mode: "0600"
      no_log: true

    - name: Copy Foundry backup script
      ansible.builtin.copy:
        src: "{{ repo_root }}/scripts/backup-foundry.sh"
        dest: /opt/vps-devops/scripts/backup-foundry.sh
        mode: "0750"

    - name: Copy Foundry restore script
      ansible.builtin.copy:
        src: "{{ repo_root }}/scripts/restore-foundry.sh"
        dest: /opt/vps-devops/scripts/restore-foundry.sh
        mode: "0750"

    - name: Install Foundry backup systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/foundry-backup.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Run Foundry Borg backup
          Wants=network-online.target
          After=network-online.target docker.service

          [Service]
          Type=oneshot
          WorkingDirectory=/opt/vps-devops/scripts
          ExecStart=/bin/bash /opt/vps-devops/scripts/backup-foundry.sh

          [Install]
          WantedBy=multi-user.target
      become: true
      register: foundry_backup_service_unit

    - name: Install Foundry backup systemd timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/foundry-backup.timer
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Schedule daily Foundry Borg backup

          [Timer]
          OnCalendar=*-*-* 05:00:00
          Persistent=true
          Unit=foundry-backup.service

          [Install]
          WantedBy=timers.target
      become: true
      register: foundry_backup_timer_unit

    - name: Reload systemd after Foundry backup unit changes
      ansible.builtin.systemd_service:
        daemon_reload: true
      become: true
      when: foundry_backup_service_unit.changed or foundry_backup_timer_unit.changed

    - name: Enable and start Foundry backup timer
      ansible.builtin.systemd_service:
        name: foundry-backup.timer
        enabled: true
        state: "{{ 'restarted' if foundry_backup_service_unit.changed or foundry_backup_timer_unit.changed else 'started' }}"
      become: true

    - name: Ensure proxy network exists
      community.docker.docker_network:
        name: proxy
        ipam_config:
          - subnet: "{{ secrets.proxy_subnet }}"

    - name: Render Foundry compose file
      ansible.builtin.template:
        src: "{{ repo_root }}/foundry/docker-compose.yml.j2"
        dest: /opt/vps-devops/foundry/docker-compose.yml
        mode: "0644"
      register: foundry_compose_result

    - name: Build Foundry env content
      ansible.builtin.set_fact:
        foundry_env_content: |
          {% if foundry_secrets.FOUNDRY_RELEASE_URL is defined and (foundry_secrets.FOUNDRY_RELEASE_URL | trim) != '' %}
          FOUNDRY_RELEASE_URL={{ foundry_secrets.FOUNDRY_RELEASE_URL }}
          {% else %}
          FOUNDRY_USERNAME={{ foundry_secrets.FOUNDRY_USERNAME }}
          FOUNDRY_PASSWORD={{ foundry_secrets.FOUNDRY_PASSWORD }}
          {% endif %}
          FOUNDRY_ADMIN_KEY={{ foundry_secrets.FOUNDRY_ADMIN_KEY }}
          FOUNDRY_HOSTNAME={{ foundry_public_hostname }}
          FOUNDRY_PROXY_PORT={{ foundry_secrets.FOUNDRY_PROXY_PORT | default('443', true) }}
          FOUNDRY_PROXY_SSL={{ foundry_secrets.FOUNDRY_PROXY_SSL | default('true', true) }}
          FOUNDRY_UPNP={{ foundry_secrets.FOUNDRY_UPNP | default('false', true) }}
          CONTAINER_CACHE={{ foundry_secrets.CONTAINER_CACHE | default('/data/container_cache', true) }}
          CONTAINER_PRESERVE_CONFIG={{ foundry_secrets.CONTAINER_PRESERVE_CONFIG | default('false', true) }}
          TZ={{ foundry_secrets.TZ | default('UTC', true) }}
          {% if foundry_secrets.FOUNDRY_LICENSE_KEY is defined and (foundry_secrets.FOUNDRY_LICENSE_KEY | trim) != '' %}
          FOUNDRY_LICENSE_KEY={{ foundry_secrets.FOUNDRY_LICENSE_KEY }}
          {% endif %}
          {% if foundry_secrets.FOUNDRY_PASSWORD_SALT is defined and (foundry_secrets.FOUNDRY_PASSWORD_SALT | trim) != '' %}
          FOUNDRY_PASSWORD_SALT={{ foundry_secrets.FOUNDRY_PASSWORD_SALT }}
          {% endif %}
          {% if foundry_secrets.FOUNDRY_WORLD is defined and (foundry_secrets.FOUNDRY_WORLD | trim) != '' %}
          FOUNDRY_WORLD={{ foundry_secrets.FOUNDRY_WORLD }}
          {% endif %}
      no_log: true

    - name: Build Foundry env hash
      ansible.builtin.set_fact:
        foundry_env_hash: "{{ foundry_env_content | hash('sha256') }}"
      no_log: true

    - name: Read previous Foundry env hash
      ansible.builtin.slurp:
        src: /opt/vps-devops/foundry/.env.sha256
      register: foundry_env_hash_file
      failed_when: false
      no_log: true

    - name: Decide whether Foundry env changed
      ansible.builtin.set_fact:
        foundry_env_changed: "{{ (foundry_env_hash_file.content | default('') | b64decode | trim) != foundry_env_hash }}"
      no_log: true

    - name: Decide whether Foundry needs full recreate
      ansible.builtin.set_fact:
        foundry_needs_recreate: "{{ foundry_compose_result.changed or foundry_env_changed }}"

    - name: Check whether Foundry already has data
      ansible.builtin.stat:
        path: /opt/vps-devops/foundry/data/Config/options.json
      register: foundry_options_file

    - name: Back up Foundry before reconfiguration
      ansible.builtin.command:
        cmd: bash /opt/vps-devops/scripts/backup-foundry.sh
      when: foundry_needs_recreate and foundry_options_file.stat.exists

    - name: Deploy Foundry with temporary .env
      block:
        - name: Write Foundry .env
          ansible.builtin.copy:
            dest: /opt/vps-devops/foundry/.env
            content: "{{ foundry_env_content }}"
            mode: "0600"
          no_log: true

        - name: Store Foundry env hash
          ansible.builtin.copy:
            dest: /opt/vps-devops/foundry/.env.sha256
            content: "{{ foundry_env_hash }}\n"
            mode: "0600"
          no_log: true

        - name: Recreate Foundry when config changed
          community.docker.docker_compose_v2:
            project_src: /opt/vps-devops/foundry
            state: present
            recreate: always
          when: foundry_needs_recreate

        - name: Ensure Foundry is running without forced recreate
          community.docker.docker_compose_v2:
            project_src: /opt/vps-devops/foundry
            state: present
          when: not foundry_needs_recreate
      always:
        - name: Remove Foundry temporary env file
          ansible.builtin.file:
            path: /opt/vps-devops/foundry/.env
            state: absent
