---
# Production inventory (single host).
# Connection secrets (ansible_host IP, become password) and all app secrets are
# supplied by group_vars/all.sops.yaml via the community.sops vars plugin, mapped
# to logical names in group_vars/all.yml. Nothing sensitive lives here.
#
# In M09 this file is replaced by a Terraform-generated inventory.
all:
  hosts:
    vps:
      ansible_user: deploy
      ansible_become_method: su
      ansible_become_user: root
