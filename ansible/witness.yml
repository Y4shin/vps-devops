---
- name: Deploy Witness
  hosts: vps

  vars:
    repo_root: "{{ playbook_dir }}/.."
    borg_rsh: "ssh -i /home/deploy/.ssh/borg_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
    awscli_arch: "{{ 'x86_64' if ansible_facts['architecture'] == 'x86_64' else 'aarch64' }}"
    deploy_user: "deploy"
    deploy_group: "deploy"
    reporting_tool_admin_oidc_application_slug: "reporting-tool-admin"
    reporting_tool_admin_oidc_client_id: "reporting-tool-admin"
    reporting_tool_admin_access_group: "reporting-tool-admin-access"

  tasks:
    - name: Set secrets variables
      ansible.builtin.set_fact:
        secrets: "{{ lookup('community.sops.sops', repo_root + '/secrets.sops.yaml') | from_yaml }}"
        app_secrets: "{{ lookup('community.sops.sops', repo_root + '/reporting-tool/.env.sops.yaml') | from_yaml }}"
      no_log: true

    - name: Determine Witness admin auth mode
      ansible.builtin.set_fact:
        witness_admin_auth_mode: >-
          {{
            (app_secrets.ADMIN_AUTH_MODE | default('') | trim)
            if (app_secrets.ADMIN_AUTH_MODE | default('') | trim) != ''
            else ('oidc' if (app_secrets.ADMIN_OIDC_CLIENT_SECRET | default('') | trim) != '' else 'password')
          }}
      no_log: true

    - name: Validate Witness secret inputs
      ansible.builtin.assert:
        that:
          - app_secrets.SESSION_SECRET is defined
          - (app_secrets.SESSION_SECRET | trim) != ""
          - app_secrets.S3_ACCESS_KEY_ID is defined
          - (app_secrets.S3_ACCESS_KEY_ID | trim) != ""
          - app_secrets.S3_SECRET_ACCESS_KEY is defined
          - (app_secrets.S3_SECRET_ACCESS_KEY | trim) != ""
          - app_secrets.borg_path is defined
          - (app_secrets.borg_path | trim) != ""
          - app_secrets.borg_passphrase is defined
          - (app_secrets.borg_passphrase | trim) != ""
          - witness_admin_auth_mode in ['password', 'oidc']
          - >-
            (
              witness_admin_auth_mode == 'password'
              and app_secrets.ADMIN_PASSWORD is defined
              and (app_secrets.ADMIN_PASSWORD | trim) != ""
            )
            or
            (
              witness_admin_auth_mode == 'oidc'
              and app_secrets.ADMIN_OIDC_CLIENT_SECRET is defined
              and (app_secrets.ADMIN_OIDC_CLIENT_SECRET | trim) != ""
            )
        fail_msg: >-
          reporting-tool/.env.sops.yaml must define SESSION_SECRET,
          S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY, borg_path, borg_passphrase,
          and either ADMIN_PASSWORD for password mode or
          ADMIN_OIDC_CLIENT_SECRET for oidc mode.
      no_log: true

    - name: Check whether AWS CLI is already installed
      ansible.builtin.command: aws --version
      register: awscli_installed
      failed_when: false
      changed_when: false
      become: true

    - name: Install unzip for AWS CLI bundle extraction
      ansible.builtin.apt:
        name:
          - unzip
        state: present
        update_cache: true
      when: awscli_installed.rc != 0
      become: true

    - name: Download AWS CLI bundle
      ansible.builtin.get_url:
        url: "https://awscli.amazonaws.com/awscli-exe-linux-{{ awscli_arch }}.zip"
        dest: /tmp/awscliv2.zip
        mode: "0644"
      when: awscli_installed.rc != 0
      become: true

    - name: Extract AWS CLI bundle
      ansible.builtin.unarchive:
        src: /tmp/awscliv2.zip
        dest: /tmp
        remote_src: true
      when: awscli_installed.rc != 0
      become: true

    - name: Install AWS CLI
      ansible.builtin.command:
        cmd: /tmp/aws/install --bin-dir /usr/local/bin --install-dir /usr/local/aws-cli
      when: awscli_installed.rc != 0
      become: true

    - name: Remove extracted AWS CLI bundle
      ansible.builtin.file:
        path: /tmp/aws
        state: absent
      when: awscli_installed.rc != 0
      become: true

    - name: Remove downloaded AWS CLI archive
      ansible.builtin.file:
        path: /tmp/awscliv2.zip
        state: absent
      when: awscli_installed.rc != 0
      become: true

    # -------------------------------------------------------------------------
    # Borg — SSH key, env file, and repo initialization
    # -------------------------------------------------------------------------
    - name: Set Borg repo URL
      ansible.builtin.set_fact:
        borg_repo: "ssh://{{ secrets.borg_user }}@{{ secrets.borg_host }}:23/{{ app_secrets.borg_path }}"
      no_log: true

    - name: Decrypt Borg SSH key to local temp file
      ansible.builtin.shell:
        cmd: sops -d --extract '["data"]' {{ repo_root }}/borg/ssh_key.sops > /tmp/borg_key_deploy
      environment:
        SOPS_AGE_KEY_FILE: "{{ repo_root }}/age.key"
      delegate_to: localhost
      become: false
      no_log: true
      changed_when: false

    - name: Deploy Borg SSH key
      ansible.builtin.copy:
        src: /tmp/borg_key_deploy
        dest: /home/deploy/.ssh/borg_key
        mode: "0600"
      no_log: true

    - name: Remove local temp Borg SSH key
      ansible.builtin.file:
        path: /tmp/borg_key_deploy
        state: absent
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Write reporting-tool Borg environment file
      ansible.builtin.copy:
        dest: /opt/vps-devops/scripts/reporting-tool-borg-env
        content: |
          export BORG_REPO="{{ borg_repo }}"
          export BORG_PASSPHRASE="{{ app_secrets.borg_passphrase }}"
          export BORG_RSH="{{ borg_rsh }}"
        mode: "0600"
      no_log: true

    - name: Check if Borg repo is already initialized
      ansible.builtin.command:
        cmd: borg info {{ borg_repo }}
      environment:
        BORG_PASSPHRASE: "{{ app_secrets.borg_passphrase }}"
        BORG_RSH: "{{ borg_rsh }}"
      register: borg_info
      failed_when: false
      changed_when: false
      no_log: true

    - name: Initialize Borg repository
      ansible.builtin.command:
        cmd: borg init --encryption=repokey {{ borg_repo }}
      environment:
        BORG_PASSPHRASE: "{{ app_secrets.borg_passphrase }}"
        BORG_RSH: "{{ borg_rsh }}"
      when: borg_info.rc != 0
      no_log: true

    # -------------------------------------------------------------------------
    # Witness — only deploy if image digest has changed
    # -------------------------------------------------------------------------

    - name: Create witness directory
      ansible.builtin.file:
        path: /opt/vps-devops/reporting-tool
        state: directory
        mode: "0755"

    - name: Create shared backups directory
      ansible.builtin.file:
        path: /opt/vps-devops/backups
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_group }}"
        mode: "0770"
      become: true

    - name: Ensure shared backup lock file is writable by deploy
      ansible.builtin.file:
        path: /opt/vps-devops/backups/.backup-job.lock
        state: touch
        owner: "{{ deploy_user }}"
        group: "{{ deploy_group }}"
        mode: "0660"
      become: true

    - name: Create reporting-tool backup staging directory
      ansible.builtin.file:
        path: /opt/vps-devops/backups/reporting-tool-staging
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_group }}"
        mode: "0700"
      become: true

    - name: Write reporting-tool backup environment file
      ansible.builtin.copy:
        dest: /opt/vps-devops/scripts/reporting-tool-backup-env
        content: |
          export REPORTING_TOOL_COMPOSE_DIR=/opt/vps-devops/reporting-tool
          export REPORTING_TOOL_CONTAINER=reporting-tool-app-1
          export REPORTING_TOOL_DB_VOLUME=reporting-tool_db_data
          export REPORTING_TOOL_STAGING_DIR=/opt/vps-devops/backups/reporting-tool-staging
          export S3_ENDPOINT={{ secrets.s3_endpoint }}
          export S3_BUCKET={{ secrets.s3_bucket }}
          export S3_REGION={{ secrets.s3_region }}
          export S3_ACCESS_KEY_ID={{ app_secrets.S3_ACCESS_KEY_ID }}
          export S3_SECRET_ACCESS_KEY={{ app_secrets.S3_SECRET_ACCESS_KEY }}
        mode: "0600"
      no_log: true

    - name: Render witness compose file
      ansible.builtin.template:
        src: "{{ repo_root }}/reporting-tool/docker-compose.yml.j2"
        dest: /opt/vps-devops/reporting-tool/docker-compose.yml
        mode: "0644"
      register: witness_compose_result

    - name: Pull latest witness image
      ansible.builtin.command:
        cmd: docker pull ghcr.io/y4shin/witness:latest --quiet
      changed_when: false

    - name: Get current witness image digest
      ansible.builtin.command:
        cmd: "docker inspect ghcr.io/y4shin/witness:latest --format '{% raw %}{{.Id}}{% endraw %}'"
      register: witness_current_digest
      changed_when: false

    - name: Read last deployed digest from server
      ansible.builtin.slurp:
        src: /opt/vps-devops/reporting-tool/.last-deployed-digest
      register: last_digest_file
      failed_when: false

    - name: Set last deployed digest fact
      ansible.builtin.set_fact:
        last_digest: "{{ last_digest_file.content | default('') | b64decode | trim }}"

    - name: Set witness image change fact
      ansible.builtin.set_fact:
        witness_image_changed: "{{ last_digest != witness_current_digest.stdout }}"

    - name: Copy reporting-tool backup script
      ansible.builtin.copy:
        src: "{{ repo_root }}/scripts/backup-reporting-tool.sh"
        dest: /opt/vps-devops/scripts/backup-reporting-tool.sh
        mode: "0750"

    - name: Copy reporting-tool restore script
      ansible.builtin.copy:
        src: "{{ repo_root }}/scripts/restore-reporting-tool.sh"
        dest: /opt/vps-devops/scripts/restore-reporting-tool.sh
        mode: "0750"

    - name: Copy compatibility backup wrapper
      ansible.builtin.copy:
        src: "{{ repo_root }}/scripts/backup.sh"
        dest: /opt/vps-devops/scripts/backup.sh
        mode: "0755"

    - name: Install reporting-tool backup systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/reporting-tool-backup.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Run reporting-tool Borg backup
          Wants=network-online.target
          After=network-online.target docker.service

          [Service]
          Type=oneshot
          WorkingDirectory=/opt/vps-devops/scripts
          ExecStart=/bin/bash /opt/vps-devops/scripts/backup-reporting-tool.sh

          [Install]
          WantedBy=multi-user.target
      become: true
      register: reporting_tool_backup_service_unit

    - name: Install reporting-tool backup systemd timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/reporting-tool-backup.timer
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Schedule daily reporting-tool Borg backup

          [Timer]
          OnCalendar=*-*-* 04:30:00
          Persistent=true
          Unit=reporting-tool-backup.service

          [Install]
          WantedBy=timers.target
      become: true
      register: reporting_tool_backup_timer_unit

    - name: Reload systemd after reporting-tool backup unit changes
      ansible.builtin.systemd_service:
        daemon_reload: true
      become: true
      when: reporting_tool_backup_service_unit.changed or reporting_tool_backup_timer_unit.changed

    - name: Enable and start reporting-tool backup timer
      ansible.builtin.systemd_service:
        name: reporting-tool-backup.timer
        enabled: true
        state: "{{ 'restarted' if reporting_tool_backup_service_unit.changed or reporting_tool_backup_timer_unit.changed else 'started' }}"
      become: true

    - name: Backup reporting-tool before deploy
      ansible.builtin.command:
        cmd: bash /opt/vps-devops/scripts/backup-reporting-tool.sh
      when: witness_image_changed and last_digest != ""

    - name: Build witness env content
      ansible.builtin.set_fact:
        witness_env_content: |
          ORIGIN=https://witness.{{ secrets.domain }}
          DATABASE_URL=file:/data/app.db
          SESSION_SECRET={{ app_secrets.SESSION_SECRET }}
          ADMIN_AUTH_MODE={{ witness_admin_auth_mode }}
          ADMIN_PASSWORD={{ app_secrets.ADMIN_PASSWORD | default('') if witness_admin_auth_mode == 'password' else '' }}
          ADMIN_OIDC_DISCOVERY_URL={{ ('https://authentik.' ~ secrets.domain ~ '/application/o/' ~ reporting_tool_admin_oidc_application_slug ~ '/') if witness_admin_auth_mode == 'oidc' else '' }}
          ADMIN_OIDC_CLIENT_ID={{ reporting_tool_admin_oidc_client_id if witness_admin_auth_mode == 'oidc' else '' }}
          ADMIN_OIDC_CLIENT_SECRET={{ app_secrets.ADMIN_OIDC_CLIENT_SECRET | default('') if witness_admin_auth_mode == 'oidc' else '' }}
          ADMIN_OIDC_SCOPES={{ 'openid profile email' if witness_admin_auth_mode == 'oidc' else '' }}
          ADMIN_OIDC_ALLOWED_EMAILS=
          ADMIN_OIDC_ALLOWED_SUBJECTS=
          ADMIN_OIDC_ALLOWED_GROUPS={{ reporting_tool_admin_access_group if witness_admin_auth_mode == 'oidc' else '' }}
          LOG_PRETTY=false
          S3_ENDPOINT={{ secrets.s3_endpoint }}
          S3_BUCKET={{ secrets.s3_bucket }}
          S3_REGION={{ secrets.s3_region }}
          S3_ACCESS_KEY_ID={{ app_secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY={{ app_secrets.S3_SECRET_ACCESS_KEY }}
      no_log: true

    - name: Build witness env hash
      ansible.builtin.set_fact:
        witness_env_hash: "{{ witness_env_content | hash('sha256') }}"
      no_log: true

    - name: Read previous witness env hash
      ansible.builtin.slurp:
        src: /opt/vps-devops/reporting-tool/.env.sha256
      register: witness_env_hash_file
      failed_when: false
      no_log: true

    - name: Decide whether witness env changed
      ansible.builtin.set_fact:
        witness_env_changed: "{{ (witness_env_hash_file.content | default('') | b64decode | trim) != witness_env_hash }}"
      no_log: true

    - name: Deploy Witness with temporary .env
      block:
        - name: Write app .env
          ansible.builtin.copy:
            dest: /opt/vps-devops/reporting-tool/.env
            content: "{{ witness_env_content }}"
            mode: "0600"
          no_log: true

        - name: Store witness env hash
          ansible.builtin.copy:
            dest: /opt/vps-devops/reporting-tool/.env.sha256
            content: "{{ witness_env_hash }}\n"
            mode: "0600"
          no_log: true

        - name: Decide whether witness needs full recreate
          ansible.builtin.set_fact:
            witness_needs_recreate: >-
              {{
                witness_image_changed
                or witness_compose_result.changed
                or witness_env_changed
              }}

        - name: Recreate witness when image changed
          community.docker.docker_compose_v2:
            project_src: /opt/vps-devops/reporting-tool
            pull: never
            state: present
            recreate: always
          when: witness_image_changed

        - name: Recreate witness when config changed
          community.docker.docker_compose_v2:
            project_src: /opt/vps-devops/reporting-tool
            state: present
            recreate: always
          when: not witness_image_changed and witness_needs_recreate

        - name: Ensure witness is running without forced recreate
          community.docker.docker_compose_v2:
            project_src: /opt/vps-devops/reporting-tool
            state: present
          when: not witness_needs_recreate

        - name: Record deployed digest
          ansible.builtin.copy:
            dest: /opt/vps-devops/reporting-tool/.last-deployed-digest
            content: "{{ witness_current_digest.stdout }}"
            mode: "0644"
          when: witness_image_changed
      always:
        - name: Remove app .env
          ansible.builtin.file:
            path: /opt/vps-devops/reporting-tool/.env
            state: absent
