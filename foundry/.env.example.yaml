# Plaintext template for Foundry secrets.
# Fill this in locally, then encrypt it into foundry/.env.sops.yaml.

# Required: choose one download/auth method.
FOUNDRY_USERNAME: your-foundry-account-email-or-username
FOUNDRY_PASSWORD: your-foundry-account-password
# FOUNDRY_RELEASE_URL: https://your-temporary-foundry-release-url

# Required runtime/admin values.
FOUNDRY_ADMIN_KEY: your-foundry-admin-key
borg_path: your-foundry-borg-repo-path
borg_passphrase: your-foundry-borg-passphrase

# Optional deployment values.
# FOUNDRY_PUBLIC_HOSTNAME: foundry.example.com
# FOUNDRY_LICENSE_KEY: your-foundry-license-key
# FOUNDRY_PASSWORD_SALT: your-foundry-password-salt
# FOUNDRY_WORLD: your-default-world-id
# FOUNDRY_PROXY_PORT: "443"
# FOUNDRY_PROXY_SSL: "true"
# FOUNDRY_UPNP: "false"
# CONTAINER_CACHE: /data/container_cache
# CONTAINER_PRESERVE_CONFIG: "false"
# TZ: Europe/Berlin
