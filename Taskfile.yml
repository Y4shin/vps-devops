version: '3'

env:
  ANSIBLE_CONFIG: ./ansible.cfg
  SOPS_AGE_KEY_FILE: ./age.key

tasks:
  lint:
    desc: Lint the Ansible code (ansible-lint, which also runs yamllint)
    cmds:
      - ansible-lint ansible/

  bootstrap:
    desc: Minimal first-contact bootstrap (create deploy user + SSH access)
    cmds:
      - bash ./scripts/local/bootstrap.sh password

  deploy:base:
    desc: Configure base host services via deploy user + inventory-configured root escalation
    cmds:
      - bash ./scripts/local/run-playbook.sh ansible/site.yml --tags base

  bootstrap:askpass:
    desc: One-time server setup using password auth (for servers without SSH key)
    cmds:
      - bash ./scripts/local/bootstrap.sh askpass

  deploy:
    desc: Deploy all services (Traefik + Authentik + Witness)
    cmds:
      - bash ./scripts/local/run-playbook.sh ansible/site.yml

  deploy:traefik:
    desc: Deploy Traefik only
    cmds:
      - bash ./scripts/local/run-playbook.sh ansible/site.yml --tags traefik

  deploy:authentik:
    desc: Deploy Authentik only
    cmds:
      - bash ./scripts/local/run-playbook.sh ansible/site.yml --tags authentik

  authentik:logs:
    desc: Tail Authentik server container logs
    interactive: true
    cmds:
      - bash ./scripts/local/ssh-run.sh docker logs --tail 100 -f authentik-server-1

  authentik:reset:
    desc: Destructively reset Authentik state on the VPS after interactive confirmation
    cmds:
      - bash ./scripts/local/reset-authentik.sh

  deploy:witness:
    desc: Deploy Witness only
    cmds:
      - bash ./scripts/local/run-playbook.sh ansible/site.yml --tags witness

  deploy:foundry:
    desc: Deploy Foundry VTT only
    cmds:
      - bash ./scripts/local/run-playbook.sh ansible/site.yml --tags foundry

  deploy:conference-tool:
    desc: Deploy Conference Tool only
    cmds:
      - bash ./scripts/local/run-playbook.sh ansible/site.yml --tags conference_tool

  deploy:n8n:
    desc: Deploy n8n only
    cmds:
      - bash ./scripts/local/run-playbook.sh ansible/site.yml --tags n8n

  ssh:n8n:
    desc: SSH into the n8n directory with a temporary .env
    interactive: true
    cmds:
      - bash ./scripts/local/ssh-shell.sh /opt/vps-devops/n8n "" ./scripts/local/env-builders/n8n.sh

  deploy:headscale:
    desc: Deploy Headscale only
    cmds:
      - bash ./scripts/local/run-playbook.sh ansible/site.yml --tags headscale

  ssh:headscale:
    desc: SSH into the headscale directory with a temporary .env
    interactive: true
    cmds:
      - bash ./scripts/local/ssh-shell.sh /opt/vps-devops/headscale "" ./scripts/local/env-builders/headscale.sh

  deploy:mail:
    desc: Deploy outbound mail relay only
    cmds:
      - bash ./scripts/local/run-playbook.sh ansible/site.yml --tags mail

  all:
    desc: "Fresh-server flow: bootstrap, base config, then service deploy"
    cmds:
      - task: bootstrap
      - task: deploy:base
      - task: deploy

  install:sops:deb:
    desc: Install sops via .deb if not present or outdated (apt-based distros only)
    silent: true
    vars:
      SOPS_VERSION: v3.12.2
    cmds:
      - bash ./scripts/local/install-sops-deb.sh {{.SOPS_VERSION}}

  install:lefthook:deb:
    desc: Install lefthook via .deb if not present or outdated (apt-based distros only)
    silent: true
    vars:
      LEFTHOOK_VERSION: v2.1.4
    cmds:
      - bash ./scripts/local/install-lefthook-deb.sh {{.LEFTHOOK_VERSION}}

  install:yq:
    desc: Install yq (Mike Farah) if not present or outdated
    silent: true
    vars:
      YQ_VERSION: v4.52.4
    cmds:
      - bash ./scripts/local/install-yq.sh {{.YQ_VERSION}}

  setup:debian:trixie:
    desc: Install all dependencies for the control node (Debian Trixie)
    silent: true
    preconditions:
      - sh: test "$(uname -s)" = "Linux"
        msg: setup:debian:trixie only supports Linux hosts
      - sh: test -f /etc/os-release && . /etc/os-release && test "$ID" = "debian" && test "$VERSION_CODENAME" = "trixie"
        msg: setup:debian:trixie requires Debian Trixie
    cmds:
      - echo "Installing system packages..."
      - sudo apt-get update && sudo apt-get install -y age borgbackup gnupg pipx openssh-client git rsync sshpass
      - task: install:sops:deb
      - task: install:yq
      - task: install:lefthook:deb
      - echo "Installing Ansible via pipx..."
      - pipx install ansible --include-deps
      - pipx ensurepath
      - echo "Installing Ansible collections..."
      - ~/.local/bin/ansible-galaxy collection install -r ansible/requirements.yml --collections-path ./collections
      - echo "Installing git hooks..."
      - lefthook install
      - task: check:unix

  check:unix:key:
    desc: Check age key is present in repo dir and fix its permissions
    silent: true
    cmds:
      - bash ./scripts/local/check-unix-key.sh

  check:unix:
    desc: Run all Unix environment checks
    silent: true
    cmds:
      - echo "Checking environment..."
      - lefthook install
      - task: check:unix:key
      - echo "All checks passed."

  ssh:
    desc: SSH into the server as deploy user
    cmds:
      - bash ./scripts/local/ssh-shell.sh

  ssh:reporting-tool-backup:
    desc: SSH into the server with reporting-tool Borg env loaded
    cmds:
      - bash ./scripts/local/ssh-shell.sh /opt/vps-devops/scripts /opt/vps-devops/scripts/reporting-tool-borg-env

  ssh:traefik:
    desc: SSH into the server and cd to the Traefik compose directory
    cmds:
      - bash ./scripts/local/ssh-shell.sh /opt/vps-devops/traefik

  ssh:authentik:
    desc: SSH into the Authentik directory with a temporary .env
    interactive: true
    cmds:
      - bash ./scripts/local/ssh-shell.sh /opt/vps-devops/authentik "" ./scripts/local/env-builders/authentik.sh

  ssh:authentik-backup:
    desc: SSH into the server with Authentik Borg env loaded
    cmds:
      - bash ./scripts/local/ssh-shell.sh /opt/vps-devops/scripts /opt/vps-devops/scripts/authentik-borg-env

  ssh:foundry:
    desc: SSH into the Foundry directory with a temporary .env
    interactive: true
    cmds:
      - bash ./scripts/local/ssh-shell.sh /opt/vps-devops/foundry "" ./scripts/local/env-builders/foundry.sh

  ssh:foundry-backup:
    desc: SSH into the server with Foundry Borg env loaded
    cmds:
      - bash ./scripts/local/ssh-shell.sh /opt/vps-devops/scripts /opt/vps-devops/scripts/foundry-borg-env

  ssh:conference-tool:
    desc: SSH into the Conference Tool directory with a temporary .env
    interactive: true
    cmds:
      - bash ./scripts/local/ssh-shell.sh /opt/vps-devops/conference-tool "" ./scripts/local/env-builders/conference-tool.sh

  ssh:mail:
    desc: SSH into the mail directory with a temporary .env
    interactive: true
    cmds:
      - bash ./scripts/local/ssh-shell.sh /opt/vps-devops/mail "" ./scripts/local/env-builders/mail.sh

  ssh:witness:
    desc: SSH into the Witness directory with a temporary .env
    interactive: true
    cmds:
      - bash ./scripts/local/ssh-shell.sh /opt/vps-devops/reporting-tool "" ./scripts/local/env-builders/witness.sh

  ssh:scripts:
    desc: SSH into the server and cd to the scripts directory
    cmds:
      - bash ./scripts/local/ssh-shell.sh /opt/vps-devops/scripts

  ssh:backups:
    desc: SSH into the server and cd to the backups directory
    cmds:
      - bash ./scripts/local/ssh-shell.sh /opt/vps-devops/backups

  witness:backup:info:
    desc: Show Borg repo info and archive list for the witness backup repo
    cmds:
      - bash ./scripts/local/witness-backup-info.sh

  witness:backup:contents:
    desc: "List files inside a witness Borg archive. Requires ARCHIVE=<name> (see: task witness:backup:info)"
    cmds:
      - bash ./scripts/local/borg-list-archive.sh reporting-tool/.env.sops.yaml "{{.ARCHIVE}}"
    requires:
      vars: [ARCHIVE]

  witness:backup:perform:
    desc: SSH to the VPS and run the witness backup script
    cmds:
      - bash ./scripts/local/ssh-run.sh "cd /opt/vps-devops/scripts && bash ./backup-reporting-tool.sh"

  witness:backup:restore:
    desc: "SSH to the VPS and run the witness restore script. Optionally pass ARCHIVE=<borg-archive-name>"
    interactive: true
    cmds:
      - bash ./scripts/local/ssh-run.sh "cd /opt/vps-devops/scripts && bash ./restore-reporting-tool.sh {{if .ARCHIVE}}{{.ARCHIVE}}{{end}}"

  authentik:backup:info:
    desc: Show Borg repo info and archive list for the Authentik backup repo
    cmds:
      - bash ./scripts/local/authentik-backup-info.sh

  authentik:backup:contents:
    desc: "List files inside an Authentik Borg archive. Requires ARCHIVE=<name> (see: task authentik:backup:info)"
    cmds:
      - bash ./scripts/local/borg-list-archive.sh authentik/.env.sops.yaml "{{.ARCHIVE}}"
    requires:
      vars: [ARCHIVE]

  authentik:backup:perform:
    desc: SSH to the VPS and run the Authentik backup script
    cmds:
      - bash ./scripts/local/ssh-run.sh "cd /opt/vps-devops/scripts && bash ./backup-authentik.sh"

  authentik:backup:restore:
    desc: "SSH to the VPS and run the Authentik restore script. Optionally pass ARCHIVE=<borg-archive-name>"
    interactive: true
    cmds:
      - bash ./scripts/local/ssh-run.sh "cd /opt/vps-devops/scripts && bash ./restore-authentik.sh {{if .ARCHIVE}}{{.ARCHIVE}}{{end}}"

  foundry:backup:info:
    desc: Show Borg repo info and archive list for the Foundry backup repo
    cmds:
      - bash ./scripts/local/foundry-backup-info.sh

  foundry:backup:contents:
    desc: "List files inside a Foundry Borg archive. Requires ARCHIVE=<name> (see: task foundry:backup:info)"
    cmds:
      - bash ./scripts/local/borg-list-archive.sh foundry/.env.sops.yaml "{{.ARCHIVE}}"
    requires:
      vars: [ARCHIVE]

  foundry:backup:perform:
    desc: SSH to the VPS and run the Foundry backup script
    cmds:
      - bash ./scripts/local/ssh-run.sh "cd /opt/vps-devops/scripts && bash ./backup-foundry.sh"

  foundry:backup:restore:
    desc: "SSH to the VPS and run the Foundry restore script. Optionally pass ARCHIVE=<borg-archive-name>"
    interactive: true
    cmds:
      - bash ./scripts/local/ssh-run.sh "cd /opt/vps-devops/scripts && bash ./restore-foundry.sh {{if .ARCHIVE}}{{.ARCHIVE}}{{end}}"

  mail:dkim:info:
    desc: Show the generated DKIM DNS record(s) for the outbound mail relay
    cmds:
      - bash ./scripts/local/mail-dkim-info.sh

  foundry:logs:
    desc: Tail Foundry container logs
    interactive: true
    cmds:
      - bash ./scripts/local/ssh-run.sh docker logs --tail 100 -f foundry-foundry-1

  foundry:start:
    desc: Start the existing Foundry container without recreating it
    cmds:
      - bash ./scripts/local/ssh-run.sh docker start foundry-foundry-1

  foundry:stop:
    desc: Stop the existing Foundry container without removing it
    cmds:
      - bash ./scripts/local/ssh-run.sh docker stop foundry-foundry-1

  foundry:migrate:data:
    desc: "Stage Foundry data from SOURCE and sync it to the VPS. SOURCE may be a local path or user@host:/path. Optional vars: DELETE=1 SOURCE_SSH_KEY=~/.ssh/key SOURCE_SSH_PORT=22"
    interactive: true
    cmds:
      - SOURCE="{{.SOURCE}}" DELETE="{{.DELETE}}" SOURCE_SSH_KEY="{{.SOURCE_SSH_KEY}}" SOURCE_SSH_PORT="{{.SOURCE_SSH_PORT}}" bash ./scripts/local/migrate-foundry-data.sh

  foundry:migrate:from-old-server:
    desc: "Migrate Foundry data from the old server (root@85.215.78.153) to the VPS. Stops foundry on the old server, stages data locally, then syncs. Run task deploy:foundry afterwards."
    interactive: true
    cmds:
      - SOURCE="root@85.215.78.153:/opt/docker_compose/data/foundry" DELETE=1 SOURCE_COMPOSE_DIR=/opt/docker_compose SOURCE_COMPOSE_SERVICE=foundry bash ./scripts/local/migrate-foundry-data.sh

  conference-tool:backup:info:
    desc: Show Borg repo info and archive list for the conference-tool backup repo
    cmds:
      - bash ./scripts/local/conference-tool-backup-info.sh

  conference-tool:backup:contents:
    desc: "List files inside a conference-tool Borg archive. Requires ARCHIVE=<name> (see: task conference-tool:backup:info)"
    cmds:
      - bash ./scripts/local/borg-list-archive.sh conference-tool/.env.sops.yaml "{{.ARCHIVE}}"
    requires:
      vars: [ARCHIVE]

  conference-tool:backup:perform:
    desc: SSH to the VPS and run the conference-tool backup script
    cmds:
      - bash ./scripts/local/ssh-run.sh "cd /opt/vps-devops/scripts && bash ./backup-conference-tool.sh"

  conference-tool:backup:restore:
    desc: "SSH to the VPS and run the conference-tool restore script. Optionally pass ARCHIVE=<borg-archive-name>"
    interactive: true
    cmds:
      - bash ./scripts/local/ssh-run.sh "cd /opt/vps-devops/scripts && bash ./restore-conference-tool.sh {{if .ARCHIVE}}{{.ARCHIVE}}{{end}}"

  conference-tool:logs:
    desc: Tail Conference Tool container logs
    interactive: true
    cmds:
      - bash ./scripts/local/ssh-run.sh docker logs --tail 100 -f conference-tool-app-1

  conference-tool:start:
    desc: Start the existing Conference Tool container without recreating it
    cmds:
      - bash ./scripts/local/ssh-run.sh docker start conference-tool-app-1

  conference-tool:stop:
    desc: Stop the existing Conference Tool container without removing it
    cmds:
      - bash ./scripts/local/ssh-run.sh docker stop conference-tool-app-1

  conference-tool:check-update:
    desc: Check whether a new conference-tool image is available on ghcr.io
    cmds:
      - |
        bash ./scripts/local/ssh-run.sh '
          docker pull ghcr.io/y4shin/open-caucus:latest --quiet
          new=$(docker inspect ghcr.io/y4shin/open-caucus:latest --format "{{.Id}}")
          stored=$(cat /opt/vps-devops/conference-tool/.last-deployed-digest 2>/dev/null || echo "")
          if [ "$new" = "$stored" ]; then
            echo "conference-tool is up to date."
          else
            echo "Update available! Run: task deploy:conference-tool"
          fi
        '

  headscale:logs:
    desc: Tail Headscale container logs
    interactive: true
    cmds:
      - bash ./scripts/local/ssh-run.sh docker logs --tail 100 -f headscale-headscale-1

  headscale:configtest:
    desc: Validate the deployed headscale config against the running binary
    cmds:
      - bash ./scripts/local/ssh-run.sh docker exec headscale-headscale-1 headscale configtest

  headscale:users:
    desc: List headscale users
    cmds:
      - bash ./scripts/local/ssh-run.sh docker exec headscale-headscale-1 headscale users list

  headscale:user:create:
    desc: "Create a headscale user. Usage: task headscale:user:create NAME=home"
    requires:
      vars: [NAME]
    cmds:
      - bash ./scripts/local/ssh-run.sh docker exec headscale-headscale-1 headscale users create {{.NAME}}

  headscale:preauthkey:create:
    desc: "Create a pre-auth key for a user. Usage: task headscale:preauthkey:create USER=home [EXPIRATION=1h] [REUSABLE=1]"
    cmds:
      - bash ./scripts/local/ssh-run.sh "docker exec headscale-headscale-1 headscale preauthkeys create --user {{.USER}} --expiration {{if .EXPIRATION}}{{.EXPIRATION}}{{else}}1h{{end}}{{if .REUSABLE}} --reusable{{end}}"
    requires:
      vars: [USER]

  headscale:nodes:
    desc: List headscale nodes (machines)
    cmds:
      - bash ./scripts/local/ssh-run.sh docker exec headscale-headscale-1 headscale nodes list

  headscale:routes:
    desc: List advertised/approved subnet routes
    cmds:
      - bash ./scripts/local/ssh-run.sh docker exec headscale-headscale-1 headscale nodes list-routes

  headscale:routes:approve:
    desc: "Approve subnet routes for a node. Usage: task headscale:routes:approve ID=1 ROUTES=192.168.1.0/24"
    requires:
      vars: [ID, ROUTES]
    cmds:
      - bash ./scripts/local/ssh-run.sh "docker exec headscale-headscale-1 headscale nodes approve-routes --identifier {{.ID}} --routes {{.ROUTES}}"

  headscale:backup:info:
    desc: Show Borg repo info and archive list for the headscale backup repo
    cmds:
      - bash ./scripts/local/headscale-backup-info.sh

  headscale:backup:perform:
    desc: SSH to the VPS and run the headscale backup script
    cmds:
      - bash ./scripts/local/ssh-run.sh "cd /opt/vps-devops/scripts && bash ./backup-headscale.sh"

  headscale:backup:restore:
    desc: "SSH to the VPS and run the headscale restore script. Optionally pass ARCHIVE=<borg-archive-name>"
    interactive: true
    cmds:
      - bash ./scripts/local/ssh-run.sh "cd /opt/vps-devops/scripts && bash ./restore-headscale.sh {{if .ARCHIVE}}{{.ARCHIVE}}{{end}}"

  witness:up:
    desc: Start or recreate the Witness stack with a temporary env file
    cmds:
      - bash ./scripts/local/witness-compose.sh up

  witness:down:
    desc: Tear down the Witness stack with a temporary env file
    cmds:
      - bash ./scripts/local/witness-compose.sh down

  witness:logs:
    desc: Tail Witness container logs
    interactive: true
    cmds:
      - bash ./scripts/local/ssh-run.sh docker logs --tail 100 -f reporting-tool-app-1

  witness:start:
    desc: Start the existing Witness container without recreating it
    cmds:
      - bash ./scripts/local/ssh-run.sh docker start reporting-tool-app-1

  witness:stop:
    desc: Stop the existing Witness container without removing it
    cmds:
      - bash ./scripts/local/ssh-run.sh docker stop reporting-tool-app-1

  witness:check-update:
    desc: Check whether a new witness image is available on ghcr.io
    cmds:
      - |
        bash ./scripts/local/ssh-run.sh '
          docker pull ghcr.io/y4shin/witness:latest --quiet
          new=$(docker inspect ghcr.io/y4shin/witness:latest --format "{{.Id}}")
          stored=$(cat /opt/vps-devops/reporting-tool/.last-deployed-digest 2>/dev/null || echo "")
          if [ "$new" = "$stored" ]; then
            echo "witness is up to date."
          else
            echo "Update available! Run: task deploy:witness"
          fi
        '

  dns:plan:
    desc: Show proposed DNS changes without applying them (dry run)
    cmds:
      - python3 ./scripts/local/dns-sync.py --dry-run {{.CLI_ARGS}}

  dns:sync:
    desc: Sync dns-records.yaml files to Hetzner DNS (shows diff, prompts, auto-backup)
    cmds:
      - python3 ./scripts/local/dns-sync.py {{.CLI_ARGS}}

  dns:backup:list:
    desc: List all stored encrypted DNS zone backups
    cmds:
      - python3 ./scripts/local/dns-sync.py list-backups

  dns:backup:restore:
    desc: "Restore a DNS zone backup by index. Usage: task dns:backup:restore INDEX=0"
    preconditions:
      - sh: test -n "{{.INDEX}}"
        msg: "dns:backup:restore requires INDEX=<n>  (see: task dns:backup:list)"
    cmds:
      - python3 ./scripts/local/dns-sync.py restore --index {{.INDEX}} {{.CLI_ARGS}}

  secrets:edit:
    desc: Interactively select and edit an encrypted secrets file
    cmds:
      - |
        FILE=$(find . -name '*.sops.yaml' -not -name '.sops.yaml' -o -name '*.sops' | sort | fzf --prompt="Edit secret file: ")
        [ -n "$FILE" ] && sops "$FILE"

  secrets:view:
    desc: Interactively select and view a decrypted secrets file in a pager
    cmds:
      - |
        FILE=$(find . -name '*.sops.yaml' -not -name '.sops.yaml' -o -name '*.sops' | sort | fzf --prompt="View secret file: ")
        [ -n "$FILE" ] && sops -d "$FILE" | less

  secrets:extract:
    desc: "Extract one value from an encrypted file. Usage: task secrets:extract FILE=ansible/inventories/prod/group_vars/all.sops.yaml TARGET='[\"sops_secrets\"][\"domain\"]'"
    preconditions:
      - sh: test -n "{{.FILE}}"
        msg: secrets:extract requires FILE=...
      - sh: test -n "{{.TARGET}}"
        msg: secrets:extract requires TARGET=...
    cmds:
      - sops -d --extract '{{.TARGET}}' {{.FILE}}

  secrets:overview:
    desc: Show a curated overview of selected decrypted secret values in a pager
    cmds:
      - bash ./scripts/local/secrets-overview.sh

  secrets:updatekeys:
    desc: Update recipients for all encrypted sops files to match .sops.yaml
    cmds:
      - find . -name '*.sops.yaml' -not -name '.sops.yaml' -exec sops updatekeys --yes {} \;
