# Plaintext template for the outbound-only mail relay.
# Fill this in locally, then encrypt it into mail/.env.sops.yaml.

# Optional. Defaults to the global domain in secrets.sops.yaml.
# MAIL_DOMAIN: pplattner.de

# Optional. Defaults to mail.<MAIL_DOMAIN>.
# MAIL_HOSTNAME: mail.pplattner.de

# Required. Used to bootstrap one local sender account so Docker Mailserver
# stays healthy and local services can send as a real address.
MAIL_SUBMISSION_PASSWORD: change-me-to-a-strong-random-password

# Optional. Defaults to authentik@<MAIL_DOMAIN>.
# MAIL_SUBMISSION_ACCOUNT: authentik@pplattner.de

# Optional. Defaults to postmaster@<MAIL_DOMAIN>.
# MAIL_POSTMASTER_ADDRESS: postmaster@pplattner.de

# Optional. Defaults to authentik@<MAIL_DOMAIN>. This is what Authentik will
# use for AUTHENTIK_EMAIL__FROM.
# MAIL_AUTHENTIK_FROM: authentik@pplattner.de
