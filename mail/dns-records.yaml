# DNS records for the outbound mail relay.
# DKIM is fetched automatically from the server at sync time — no manual paste needed.

records:
  - name: mail
    type: A
    value: "{{ vps_ipv4 }}"
    ttl: 3600

  - name: mail
    type: AAAA
    value: "{{ vps_ipv6 }}"
    ttl: 3600

  - name: "@"
    type: MX
    value: "10 mail"
    ttl: 3600

  - name: "@"
    type: TXT
    value: "v=spf1 a:mail.{{ domain }} -all"
    ttl: 3600

  - name: _dmarc
    type: TXT
    value: "v=DMARC1; p=none; rua=mailto:postmaster@{{ domain }}"
    ttl: 3600
